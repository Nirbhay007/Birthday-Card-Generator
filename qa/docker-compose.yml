services:
  qa-postgres:
    image: postgres:16-alpine
    container_name: birthdaygen-qa-postgres
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa
      POSTGRES_DB: birthday_qa
    ports:
      - "5433:5432"
    # Parallel Playwright workers + dev-server route modules can open more
    # connections than the default 100. This database is ephemeral and local.
    command: ["postgres", "-c", "max_connections=300"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d birthday_qa"]
      interval: 1s
      timeout: 3s
      retries: 60
    # Ephemeral on purpose: stopping the container drops the QA database.
    tmpfs:
      - /var/lib/postgresql/data
